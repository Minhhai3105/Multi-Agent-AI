name: CI

# Runs on every pull request to main and on pushes to main.
# Verifies the architecture drivers automatically (Architecture Design v1.4, Chapter 9):
#   - R1-R6 dependency rules reconstructed from the code (scripts/check_architecture.py)
#   - QA-1..QA-6, FR3-FR5, FR4, FR9 test suite against a real PostgreSQL 16
#   - the React SPA builds, and the production Docker image builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - architecture check + tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maap_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maap_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Architecture conformance (rules R2-R6, layer direction)
        run: python scripts/check_architecture.py

      - name: Test suite (QA-1..QA-6, FR3-FR5, FR4, FR9)
        run: python -m pytest -v -p no:cacheprovider --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker image - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "Build production image (allocation view - one application host)"
        run: docker build -t multi-agent-ai:ci .

      - name: Smoke test - image starts and serves health + SPA
        run: |
          docker network create ci-net
          docker run -d --name db --network ci-net \
            -e POSTGRES_USER=maap -e POSTGRES_PASSWORD=maap -e POSTGRES_DB=maap postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U maap -d maap && break; sleep 2; done
          docker run -d --name app --network ci-net -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://maap:maap@db:5432/maap multi-agent-ai:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          curl -fsS http://localhost:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/chat)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/me)" = "401"

      - name: Container logs
        if: always()
        run: docker logs app || true
